name: wagering

x-app-environment: &app-environment
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  SQS_ENDPOINT: http://sqs:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  LOG_LEVEL: info
  APP_ROLES: api,consumer,outbox,pending-reference

x-app: &app
  build: .
  image: wagering-app:local
  depends_on:
    setup:
      condition: service_completed_successfully
  stop_grace_period: 30s
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 2s
      retries: 30

  sqs:
    image: ministackorg/ministack:1.5.37
    environment:
      SERVICES: sqs
      LOG_LEVEL: WARNING
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  setup:
    build: .
    image: wagering-app:local
    environment: *app-environment
    command: ["sh", "-c", "bun run db:migrate && bun run sqs:setup"]
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy
    restart: "no"

  app-1:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app-1
    ports:
      - "3001:3000"

  app-2:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app-2
    ports:
      - "3002:3000"

  app-3:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app-3
    ports:
      - "3003:3000"

volumes:
  postgres-data:
